# Render blueprint for AlgoLens.
#   one web service (Node + bm25/dense/hybrid rankers + static UI)
#   Postgres is Neon (hosted, free tier). DATABASE_URL is set in the Render
#   dashboard as a secret env var — not declared here, so the blueprint stays
#   safe to commit.
#   The dense ranker's model is baked into the Docker image at build time and
#   the corpus embeddings are committed (data/embeddings/), so boot needs no
#   network beyond Postgres.
#
# NOTE: applying a Blueprint requires a payment method on file at Render even
# for free plans. The card-free path is creating the web service manually in
# the dashboard with the same settings — see "Deploy" in docs/internals.md.
# This file then serves as the reference for what to configure.
#
# Run migrations once from your own machine against Neon (the Render Shell
# tab is also paid-only):
#   DATABASE_URL='...' bash db/run-migrations.sh
#
# To enable the Go gRPC ranker in prod, add a private service that builds
# from ./go and set GRPC_BM25_ADDR on the web service to its internal hostname.

services:
  - type: web
    name: algolens-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    # Custom domains are added in the dashboard for manually-created services;
    # listed here so the blueprint stays the source of truth if it's ever applied.
    domains:
      - onebysec.com
      - www.onebysec.com
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set in the Render dashboard: paste the pooled Neon connection string.
      # Must include `sslmode=require` (the app keys SSL off that).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Encrypts linked judge handles and their cached stats. generateValue
      # gives 32 random bytes that live in Render and never touch Neon — that
      # split is the whole point: a database copy is ciphertext without it.
      # Changing this value orphans existing rows, so rotate deliberately.
      - key: HANDLE_KEY
        generateValue: true
      # Default ranker stays bm25 (best MRR on the bench); dense + hybrid are
      # registered and reachable per-request via ?ranker=. Flip to hybrid here
      # if/when the bench says so. gRPC ranker stays off in v1.
      - key: RANKER
        value: bm25
      # Set once DNS resolves: sends www.* to the bare domain so sessions
      # (host-only cookies) live on exactly one host. Leave unset to disable.
      - key: CANONICAL_HOST
        value: onebysec.com
