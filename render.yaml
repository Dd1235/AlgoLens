# Render blueprint for AlgoLens.
#   one web service (Node + bm25/dense/hybrid rankers + static UI)
#   Postgres is Neon (hosted, free tier). DATABASE_URL is set in the Render
#   dashboard as a secret env var — not declared here, so the blueprint stays
#   safe to commit.
#   The dense ranker's model is baked into the Docker image at build time and
#   the corpus embeddings are committed (data/embeddings/), so boot needs no
#   network beyond Postgres.
#
# After first deploy, run migrations once via the Render shell:
#   bash db/run-migrations.sh
#
# To enable the Go gRPC ranker in prod, add a private service that builds
# from ./go and set GRPC_BM25_ADDR on the web service to its internal hostname.

services:
  - type: web
    name: algolens-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set in the Render dashboard: paste the pooled Neon connection string.
      # Must include `sslmode=require` (the app keys SSL off that).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Default ranker stays bm25 (best MRR on the bench); dense + hybrid are
      # registered and reachable per-request via ?ranker=. Flip to hybrid here
      # if/when the bench says so. gRPC ranker stays off in v1.
      - key: RANKER
        value: bm25
