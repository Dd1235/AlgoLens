<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cosine</title>
    <meta name="description" content="Search 1,800+ competitive-programming problems by keyword, by describing the idea, or by technique label." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cosine" />
    <meta property="og:url" content="https://onebysec.com/" />
    <meta property="og:title" content="cosine — search DSA problems by meaning" />
    <meta property="og:description" content="Search 1,800+ competitive-programming problems by keyword, by describing the idea, or by technique label." />
    <meta name="twitter:card" content="summary" />
    <script src="/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>
          <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><polyline points="24,24 50,50 24,76" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="miter"></polyline><rect x="60" y="32" width="17" height="36" fill="var(--accent)"></rect></svg>
          cosine
          <span class="signature" title="dedeepya avancha">[da]</span>
        </h1>
        <nav class="header-actions" aria-label="Page actions">
          <span id="auth-widget" class="auth-widget">
            <span data-anon>
              <a href="/login.html" class="auth-link">log in</a>
              <span class="auth-sep">·</span>
              <a href="/signup.html" class="auth-link">sign up</a>
            </span>
            <span class="auth-user" data-signed hidden>
              <span class="auth-email" id="auth-email"></span>
              <button type="button" id="logout-btn" class="auth-logout">
                log out
              </button>
            </span>
          </span>
          <button type="button" class="theme-toggle" data-theme-toggle>
            light mode
          </button>
          <a href="/patterns.html" class="debug-link">patterns</a>
          <a href="/profile.html" class="debug-link">profile</a>
          <a href="/stats.html" class="debug-link">stats</a>
          <a href="/debug.html" class="debug-link">debug</a>
        </nav>
      </header>
      <p class="tagline">1808 dsa problems · search by keyword, by meaning, or by technique</p>
      <form id="search-form" autocomplete="off">
        <input
          id="search-input"
          type="search"
          placeholder="graph cycle / monotonic / knapsack"
        />
        <span class="filter-wrap">
          <select
            id="ranker-select"
            class="filter-select"
            aria-label="ranking mode"
            title="how results are ranked: keyword match, semantic meaning, or both fused"
          >
            <option value="bm25">bm25 · keyword</option>
          </select>
        </span>
        <span id="filter-wrap" class="filter-wrap" hidden>
          <select
            id="filter-select"
            class="filter-select"
            aria-label="filter results by done state"
            title="filter results by your done state"
          >
            <option value="all">all</option>
            <option value="notdone">not done</option>
            <option value="done">done</option>
          </select>
        </span>
        <button type="submit">search</button>
      </form>
      <div id="lib-bar" class="lib-bar" hidden>
        <span class="lib-prompt"
          ><span class="lib-host">cosine</span
          ><span class="lib-path" id="lib-path">~</span
          ><span class="lib-cursor">$</span></span
        >
        <span class="lib-chips">
          <button type="button" class="lib-chip" data-cmd=":bookmarks" title="list your starred problems (:b)">
            ★ <span id="lib-count-bookmarks">0</span> bookmarks
          </button>
          <button type="button" class="lib-chip" data-cmd=":done" title="list problems you marked done (:d)">
            ✓ <span id="lib-count-done">0</span> done
          </button>
          <button type="button" class="lib-chip" data-cmd=":all" title="list everything saved (:all)">
            : ls all
          </button>
          <button type="button" class="lib-chip lib-chip-back" data-cmd="" title="back to search">
            ↺ search
          </button>
        </span>
      </div>
      <div class="mode-row">
        <label class="mode-toggle" title="run the same query on bm25 and dense side by side">
          <input id="compare-toggle" type="checkbox" />
          <span>compare bm25 / dense</span>
        </label>
        <span id="latency-summary" class="latency-summary"></span>
      </div>
      <p id="status" class="status">
        type a query to search · :help for the manual<span class="cursor">_</span>
      </p>
      <button
        id="pattern-pill"
        class="pattern-pill hidden"
        type="button"
        title="clear pattern filter"
      ></button>
      <ul id="results" class="single-mode"></ul>
      <button id="load-more" class="load-more hidden" type="button">
        load more
      </button>
      <div id="feedback-row" class="feedback-row hidden">
        <span class="feedback-ask">// useful?</span>
        <button id="fb-yes" type="button" class="lib-chip" title="this search found what I wanted">y</button>
        <button id="fb-no" type="button" class="lib-chip" title="not what I was looking for">n</button>
        <input
          id="fb-reason"
          class="feedback-reason hidden"
          type="text"
          maxlength="200"
          placeholder="what were you looking for? (optional)"
        />
        <button id="fb-send" type="button" class="lib-chip hidden">send</button>
      </div>
      <div id="compare-results" class="compare-grid hidden"></div>
    </main>
    <footer>cosine v0.4 · deepya · leetcode + cses · <a href="/stats.html">stats</a></footer>
    <script src="/app.js"></script>
  </body>
</html>
