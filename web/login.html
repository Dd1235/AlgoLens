<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cosine · log in</title>
    <script src="/theme.js"></script>
    <meta name="author" content="Dedeepya Avancha (Dd1235)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="auth-main">
      <header class="page-header">
        <h1>
          <a href="/" class="home-link"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><polyline points="24,24 50,50 24,76" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="miter"></polyline><rect x="60" y="32" width="17" height="36" fill="var(--accent)"></rect></svg> cosine</a>
          <span class="signature" title="dedeepya avancha">[da]</span>
        </h1>
        <nav class="header-actions" aria-label="Page actions">
          <button type="button" class="theme-toggle" data-theme-toggle>light mode</button>
        </nav>
      </header>

      <section class="auth-card">
        <h2 class="auth-heading">log in</h2>
        <form id="auth-form" class="auth-form" autocomplete="on" data-mode="login" data-endpoint="/api/auth/login">
          <input type="email" name="email" placeholder="email" required autocomplete="email" />
          <input type="password" name="password" placeholder="password" required autocomplete="current-password" minlength="8" />
          <button type="submit">log in</button>
          <p class="auth-error" id="auth-error" hidden></p>
        </form>
        <p class="auth-foot">
          no account? <a href="/signup.html">sign up</a> · or <a href="/">browse without one</a>
        </p>
      </section>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
