<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cosine · profile</title>
    <meta name="description" content="Your LeetCode, Codeforces, CodeChef and GitHub activity in one combined heatmap." />
    <script src="/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>
          <a href="/" class="home-link"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><polyline points="24,24 50,50 24,76" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="miter"></polyline><rect x="60" y="32" width="17" height="36" fill="var(--accent)"></rect></svg> cosine</a>
          <span class="signature" title="dedeepya avancha">[da]</span>
        </h1>
        <nav class="header-actions" aria-label="Page actions">
          <button type="button" class="theme-toggle" data-theme-toggle>
            light mode
          </button>
          <a href="/" class="debug-link">search</a>
          <a href="/patterns.html" class="debug-link">patterns</a>
        </nav>
      </header>
      <p class="tagline">handles across judges · one combined picture</p>
      <p id="profile-status" class="status">
        loading<span class="cursor">_</span>
      </p>

      <form id="handles-form" class="handles-form" autocomplete="off">
        <label class="handle-field">
          <span>leetcode</span>
          <input id="handle-leetcode" type="text" spellcheck="false" placeholder="username" />
        </label>
        <label class="handle-field">
          <span>codeforces</span>
          <input id="handle-codeforces" type="text" spellcheck="false" placeholder="handle" />
        </label>
        <label class="handle-field">
          <span>codechef</span>
          <input id="handle-codechef" type="text" spellcheck="false" placeholder="username" />
        </label>
        <label class="handle-field">
          <span>github</span>
          <input id="handle-github" type="text" spellcheck="false" placeholder="username" />
        </label>
        <button type="submit">save handles</button>
        <span id="handles-msg" class="handles-msg"></span>
      </form>

      <div id="platform-cards" class="platform-cards"></div>

      <section id="heatmap-section" class="heatmap-section hidden">
        <div id="heatmap-tabs" class="heatmap-tabs" role="tablist" aria-label="Activity view; use left and right arrow keys to switch">
          <button type="button" class="lib-chip is-active" role="tab" aria-selected="true" tabindex="0" data-tab="overall" title="everything: dsa + dev">overall</button>
          <button type="button" class="lib-chip" role="tab" aria-selected="false" tabindex="-1" data-tab="dsa" title="leetcode + codeforces + cosine done marks">dsa</button>
          <button type="button" class="lib-chip" role="tab" aria-selected="false" tabindex="-1" data-tab="dev" title="github contributions">dev</button>
        </div>
        <p id="heatmap-total" class="heatmap-total"></p>
        <div id="heatmap-months" class="heatmap-months"></div>
        <div id="heatmap" class="heatmap"></div>
        <p class="heatmap-foot">
          <a href="#" id="refresh-link">refresh stats</a>
          <span class="heatmap-legend">less <span class="hm hm-l0"></span><span class="hm hm-l1"></span><span class="hm hm-l2"></span><span class="hm hm-l3"></span><span class="hm hm-l4"></span> more</span>
        </p>
      </section>
    </main>
    <footer>cosine · platform stats cached ~12h · codechef is best-effort · <a href="/stats.html">stats</a> · <a href="/debug.html">debug</a></footer>
    <script src="/profile.js"></script>
  </body>
</html>
